name: Publish qualified WireGuard packages
on:
  push:
    branches: [ams-fra-throughput]
    paths:
      - .github/workflows/publish-wireguard-candidate.yml
      - hack/wireguard-throughput/publication.json
      - hack/wireguard-throughput/publish-candidate.py
      - hack/wireguard-throughput/test-publish-candidate.py
permissions: {}
concurrency:
  group: qualified-wireguard-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'noeljackson/pkgs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/wireguard-publisher-docker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check publication boundaries
        run: python3 hack/wireguard-throughput/test-publish-candidate.py
      - name: Install registry client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact qualified pair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 hack/wireguard-throughput/publish-candidate.py
      - name: Remove transient registry material
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
